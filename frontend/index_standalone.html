<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pranjal's AI Resume Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            padding: 16px;
            backdrop-filter: blur(10px);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        .status.online {
            color: #10b981;
        }

        .status.offline {
            color: #ef4444;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status.online .status-dot {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
        }

        .status.offline .status-dot {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .chat-area::-webkit-scrollbar {
            width: 8px;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 4px;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            text-align: center;
        }

        .welcome-content {
            max-width: 600px;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 40px;
        }

        .topic-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 500;
            cursor: default;
        }

        .topic-item:hover {
            background: rgba(71, 85, 105, 0.6);
            border-color: rgba(148, 163, 184, 0.3);
        }

        .suggested-questions {
            text-align: left;
        }

        .suggested-label {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .suggestion-button {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            color: #93c5fd;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 8px;
        }

        .suggestion-button:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateX(4px);
        }

        .messages-container {
            display: none;
        }

        .messages-container.active {
            display: flex;
            flex-direction: column;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
            justify-content: flex-end;
        }

        .message-avatar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 70%;
        }

        .message.user .message-content {
            text-align: right;
        }

        .message-text {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-text {
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            color: white;
            border-radius: 16px 4px 16px 16px;
        }

        .message.assistant .message-text {
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #e2e8f0;
            border-radius: 4px 16px 16px 16px;
        }

        .typing-indicator {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 4px 16px 16px 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #60a5fa;
            animation: typing 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .error-message {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .error-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .error-content {
            flex: 1;
        }

        .error-title {
            font-weight: 600;
            color: #fca5a5;
            margin-bottom: 4px;
        }

        .error-text {
            font-size: 14px;
            color: #fecaca;
        }

        .input-section {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(59, 130, 246, 0.2);
            padding: 16px;
            backdrop-filter: blur(10px);
        }

        .input-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            width: 100%;
        }

        textarea {
            flex: 1;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            color: #e2e8f0;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            max-height: 120px;
            min-height: 44px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        textarea::placeholder {
            color: #64748b;
        }

        textarea:focus {
            background: rgba(30, 41, 59, 1);
            border-color: rgba(59, 130, 246, 0.6);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        textarea:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .send-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-icon.loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .new-chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: none;
            z-index: 50;
        }

        .new-chat-button.visible {
            display: block;
        }

        .new-chat-button:hover {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 18px;
            }

            .status-text {
                display: none;
            }

            .message-content {
                max-width: 85%;
            }

            .welcome-title {
                font-size: 24px;
            }

            .topics-grid {
                grid-template-columns: 1fr;
            }

            textarea {
                min-height: 40px;
                padding: 10px 12px;
            }

            .send-button {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>AI Resume Assistant</h1>
            <div class="status online" id="status">
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="chat-area">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-content">
                    <h2 class="welcome-title">Welcome to my AI Assistant</h2>
                    <p class="welcome-subtitle">
                        Ask me anything about my professional background, experience, skills, projects, or education.
                    </p>

                    <div class="topics-grid">
                        <div class="topic-item">💼 Experience</div>
                        <div class="topic-item">🛠️ Skills</div>
                        <div class="topic-item">🎓 Education</div>
                        <div class="topic-item">🚀 Projects</div>
                    </div>

                    <div class="suggested-questions">
                        <p class="suggested-label">Suggested questions:</p>
                        <div id="suggestionsContainer"></div>
                    </div>
                </div>
            </div>

            <!-- Messages Container -->
            <div class="messages-container" id="messagesContainer"></div>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="Ask me about my experience, skills, projects..."
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton" title="Send message">→</button>
            </div>
        </div>
    </div>

    <button class="new-chat-button" id="newChatButton">New Chat</button>

    <script>
        // Production: Change this URL to your deployed backend
        // Format: https://your-backend-url.onrender.com
        const API_URL = 'http://10.72.209.193:8000';
        
        const elements = {
            messageInput: document.getElementById('messageInput'),
            sendButton: document.getElementById('sendButton'),
            messagesContainer: document.getElementById('messagesContainer'),
            welcomeScreen: document.getElementById('welcomeScreen'),
            statusIndicator: document.getElementById('status'),
            newChatButton: document.getElementById('newChatButton'),
            suggestionsContainer: document.getElementById('suggestionsContainer'),
        };

        const suggestedQuestions = [
            'What are your technical skills?',
            'Tell me about your projects',
            'What is your educational background?',
            'Do you have internship experience?',
            'What programming languages do you know?',
            'Tell me about your work experience',
        ];

        let messages = [];
        let isLoading = false;

        // Initialize suggestions
        function initSuggestions() {
            suggestedQuestions.forEach(q => {
                const btn = document.createElement('button');
                btn.className = 'suggestion-button';
                btn.textContent = q;
                btn.onclick = () => sendMessage(q);
                elements.suggestionsContainer.appendChild(btn);
            });
        }

        // Check backend health
        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                return response.ok;
            } catch {
                return false;
            }
        }

        // Update status
        async function updateStatus() {
            const isOnline = await checkHealth();
            elements.statusIndicator.className = `status ${isOnline ? 'online' : 'offline'}`;
            elements.statusIndicator.innerHTML = `
                <span class="status-dot"></span>
                <span class="status-text">${isOnline ? 'Online' : 'Offline'}</span>
            `;
            return isOnline;
        }

        // Send message
        async function sendMessage(question) {
            question = question.trim();
            if (!question || isLoading) return;

            isLoading = true;
            elements.sendButton.disabled = true;
            elements.messageInput.disabled = true;

            // Show chat area
            showChatArea();

            // Add user message
            addMessage('user', question);
            elements.messageInput.value = '';
            resetTextarea();

            try {
                // Show typing indicator
                showTypingIndicator();

                // Check backend first
                const isBackendAvailable = await checkHealth();
                if (!isBackendAvailable) {
                    throw new Error('Unable to connect to the AI assistant. Please make sure the backend is running.');
                }

                // Send request
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question }),
                });

                if (!response.ok) {
                    throw new Error('Backend error. Please try again.');
                }

                const data = await response.json();
                removeTypingIndicator();
                addMessage('assistant', data.answer);
            } catch (error) {
                removeTypingIndicator();
                showError(error.message);
                console.error('Chat error:', error);
            } finally {
                isLoading = false;
                elements.sendButton.disabled = false;
                elements.messageInput.disabled = false;
                elements.messageInput.focus();
                scrollToBottom();
            }
        }

        // Add message to UI
        function addMessage(role, content) {
            messages.push({ role, content });

            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;

            if (role === 'assistant') {
                const avatar = document.createElement('div');
                avatar.className = 'message-avatar';
                avatar.textContent = 'AI';
                messageEl.appendChild(avatar);
            }

            const contentEl = document.createElement('div');
            contentEl.className = 'message-content';

            const textEl = document.createElement('div');
            textEl.className = 'message-text';
            textEl.textContent = content;
            contentEl.appendChild(textEl);

            messageEl.appendChild(contentEl);
            elements.messagesContainer.appendChild(messageEl);
        }

        // Show typing indicator
        function showTypingIndicator() {
            const messageEl = document.createElement('div');
            messageEl.className = 'message assistant typing-indicator';
            messageEl.id = 'typingIndicator';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = 'AI';

            const dotsEl = document.createElement('div');
            dotsEl.className = 'typing-dots';
            dotsEl.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

            messageEl.appendChild(avatar);
            messageEl.appendChild(dotsEl);
            elements.messagesContainer.appendChild(messageEl);
            scrollToBottom();
        }

        // Remove typing indicator
        function removeTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // Show error
        function showError(error) {
            const errorEl = document.createElement('div');
            errorEl.className = 'error-message';
            errorEl.innerHTML = `
                <div class="error-icon">⚠️</div>
                <div class="error-content">
                    <div class="error-title">Something went wrong</div>
                    <div class="error-text">${error}</div>
                </div>
            `;
            elements.messagesContainer.appendChild(errorEl);
        }

        // Show chat area
        function showChatArea() {
            elements.welcomeScreen.style.display = 'none';
            elements.messagesContainer.classList.add('active');
            elements.newChatButton.classList.add('visible');
        }

        // Reset to welcome screen
        function resetChat() {
            messages = [];
            elements.messagesContainer.innerHTML = '';
            elements.messagesContainer.classList.remove('active');
            elements.welcomeScreen.style.display = 'flex';
            elements.newChatButton.classList.remove('visible');
            elements.messageInput.value = '';
            resetTextarea();
        }

        // Scroll to bottom
        function scrollToBottom() {
            setTimeout(() => {
                const chatArea = document.querySelector('.chat-area');
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 0);
        }

        // Auto-expand textarea
        function resetTextarea() {
            elements.messageInput.style.height = 'auto';
        }

        elements.messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Send on Enter, new line on Shift+Enter
        elements.messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(elements.messageInput.value);
            }
        });

        elements.sendButton.addEventListener('click', () => {
            sendMessage(elements.messageInput.value);
        });

        elements.newChatButton.addEventListener('click', resetChat);

        // Initialize
        initSuggestions();
        updateStatus();
        setInterval(updateStatus, 30000);
    </script>
</body>
</html>
